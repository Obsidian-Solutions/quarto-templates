# SPDX-License-Identifier: MIT
name: publish-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.10.18

      - name: Install TeX Live (TinyTeX, matches the 2026 dev toolchain)
        run: |
          # The Pages site ships PDF and DOCX alongside the HTML, so
          # the full TeX toolchain is needed here too. TinyTeX is a
          # rolling distribution matching the Arch TeX Live 2026 the
          # template is developed against.
          # Accepted supply-chain risk: TinyTeX and its packages are
          # unpinned (rolling by design). The GitHub Actions and the
          # Montserrat fonts ARE pinned and checksum-verified.
          quarto install tinytex --update-path
          tlmgr install \
            titlesec fancyhdr zref draftwatermark tocloft embedfile \
            tcolorbox needspace caption microtype booktabs etoolbox float \
            fontspec tex-gyre
          which tlmgr lualatex && lualatex --version | head -1

      - name: Install Montserrat (pinned upstream commit, SHA-256 verified)
        run: bash tools/install-fonts.sh

      - name: Install qpdf, fonts and verapdf
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf fonts-liberation
          quarto install verapdf

      - name: Render the example (HTML, PDF, DOCX)
        run: |
          # render.sh stamps the baseline and generates manifest.json
          # (the embed filter attaches it to the PDF/A archive), then
          # validates with verapdf. It renders the formats declared in
          # the front matter: PDF, HTML, DOCX and EPUB.
          ./render.sh examples/template.qmd
          cp _extensions/obsidian/assets/obsidian-logo.png obsidian-logo.png

      - name: Render the remaining formats (deck, dashboard)
        run: |
          # The example site ships every format the template produces.
          # Each example declares its full format family, so one
          # command per file renders them all: the deck yields the
          # revealjs html, its beamer PDF, and its editable PPTX; the
          # dashboard yields its html. render.sh already produced the
          # document's four formats (PDF, HTML, DOCX, EPUB) above.
          quarto render examples/template-slides.qmd
          quarto render examples/template-dashboard.qmd

      - name: Assemble the site
        run: |
          mkdir -p site
          cp _output/examples/template.html site/index.html
          cp _output/examples/template.pdf site/template.pdf
          cp _output/examples/template.docx site/template.docx
          cp _output/examples/template.epub site/template.epub
          cp _output/examples/template-slides.html site/template-slides.html
          cp _output/examples/template-slides.pdf site/template-slides.pdf
          cp _output/examples/template-slides.pptx site/template-slides.pptx
          cp _output/examples/template-dashboard.html site/template-dashboard.html
          cp obsidian-logo.png site/obsidian-logo.png
          cp accessibility-statement.md site/accessibility-statement.md
          cp -r _output/examples/template_files site/template_files
          cp -r _output/examples/template-slides_files site/template-slides_files
          cp -r _output/examples/template-dashboard_files site/template-dashboard_files

      - name: Add format download links to the page
        run: |
          python3 - <<'PYEOF'
          # Insert a small download bar under the title so visitors
          # can fetch every format the template produces: the PDF
          # (controlled record), DOCX (working copy), the revealjs
          # deck, its editable PPTX, and the dashboard.
          html = open('site/index.html').read()
          bar = (
            '<div style="font-family: Montserrat, sans-serif; font-size: 0.85rem; '
            'border: 1px solid #cecece; border-left: 3px solid #121212; '
            'padding: 0.6rem 1rem; margin: 1rem 0; color: #484949;">'
            'Download: '
            '<a href="template.pdf">PDF</a> &nbsp;|&nbsp; '
            '<a href="template.docx">DOCX</a> &nbsp;|&nbsp; '
            '<a href="template.epub">EPUB</a> &nbsp;|&nbsp; '
            '<a href="index.html">HTML</a> &nbsp;|&nbsp; '
            '<a href="template-slides.html">Slides</a> &nbsp;|&nbsp; '
            '<a href="template-slides.pdf">Slides PDF</a> &nbsp;|&nbsp; '
            '<a href="template-slides.pptx">PPTX</a> &nbsp;|&nbsp; '
            '<a href="template-dashboard.html">Dashboard</a> &nbsp;|&nbsp; '
            '<a href="accessibility-statement.md">Accessibility statement</a>'
            '</div>'
          )
          # Insert after the title block header.
          marker = '</header>'
          if marker in html:
            html = html.replace(marker, marker + bar, 1)
          else:
            html = html.replace('</body>', bar + '</body>', 1)
          open('site/index.html', 'w').write(html)
          PYEOF

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
