name: release

# Creates a draft release when a version tag is pushed to main. The
# tag IS the version: the release procedure in CONTRIBUTING.md makes
# the tag from the extension version in _extension.yml, and this
# workflow fails if they disagree. It renders the example formats
# (running the render gates), regenerates the SBOM, and drafts the
# release with the automatic release notes. A human reviews the
# draft and publishes it; publishing triggers the attest workflow,
# which signs the assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The job runs in the protected "release" environment, which
    # records the deployment. A required reviewer can be added there
    # in Settings > Environments when a second person joins; for a
    # single maintainer the draft is the human review point.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the tag matches the extension version
        run: |
          TAG="${{ github.ref_name }}"
          grep -q "^version: ${TAG#v}$" _extensions/obsidian/_extension.yml \
            || { echo "tag $TAG does not match the extension version"; exit 1; }

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.10.18

      - name: Install TeX Live (TinyTeX, matches the 2026 dev toolchain)
        run: |
          quarto install tinytex --update-path
          # The bundled tlmgr ships older than the tlnet repository and
          # refuses to install packages until updated. Update it first.
          tlmgr update --self
          tlmgr install \
            titlesec fancyhdr zref draftwatermark tocloft embedfile \
            tcolorbox needspace caption microtype booktabs etoolbox float \
            fontspec tex-gyre \
            calculator wallpaper hyphenat
          which lualatex

      - name: Install Montserrat (pinned upstream commit, SHA-256 verified)
        run: bash tools/install-fonts.sh

      - name: Install verapdf and qpdf
        run: |
          quarto install verapdf
          sudo apt-get update && sudo apt-get install -y qpdf fonts-liberation poppler-utils

      - name: Render the example formats (the render gates run)
        run: |
          ./render.sh examples/template.qmd
          quarto render examples/template-slides.qmd
          quarto render examples/template-dashboard.qmd

      - name: Regenerate the SBOM and build the extension archive
        run: |
          python3 tools/make-sbom.py
          TAG="${{ github.ref_name }}"
          (cd _extensions && zip -qr "../obsidian-extension-${TAG}.zip" obsidian)

      - name: Drop any existing release for the tag
        # A re-run (e.g. after moving the tag) otherwise stacks a second
        # release object for the same version. Delete first so the fresh
        # draft replaces it; the tag itself is left in place.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || \
            echo "no existing release for $TAG to drop"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --generate-notes \
            --title "$TAG" \
            _output/examples/template.pdf \
            _output/examples/template.docx \
            _output/examples/template.html \
            _output/examples/template.epub \
            _output/examples/template-slides.html \
            _output/examples/template-slides.pdf \
            _output/examples/template-slides.pptx \
            _output/examples/template-dashboard.html \
            "obsidian-extension-${TAG}.zip" \
            sbom.spdx.json
