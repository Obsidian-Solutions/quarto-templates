# _schema.yml for the obsidian extension.
# Describes the house front matter for IDE tooling and runtime validation.
#
# The house template uses TOP-LEVEL front matter (title, author, date,
# reference, invoice:), not format-block options. The fields below are
# the metadata surface every obsidian-* format accepts. The
# structured-fields.lua filter enforces the required fields at render;
# this schema powers editor completion and static checks.

$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v2/extension-schema.json

options:
  title:
    type: string
    required: true
    description: "Document title."
  subtitle:
    type: string
    description: "Document subtitle."
  author:
    type: [string, array]
    required: true
    description: "Author name or list of names."
  date:
    type: string
    format: date
    required: true
    description: "Document date (ISO form, for example 2026-08-14)."
  lang:
    type: string
    default: en-GB
    description: "Language tag. The template default is en-GB."
  reference:
    type: string
    pattern: "^OS-[A-Z]+-[0-9]{3}$"
    description: "House reference in the form OS-TYPE-NNN (verified by verify.lua)."
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "Version in semantic versioning form (verified by verify.lua)."
  confidentiality:
    type: string
    enum:
      - Open
      - Internal
      - "Commercial in Confidence"
      - Official
      - "Official-Sensitive"
      - Secret
      - "Top Secret"
    description: "Classification marking. Shown on every page."
  doc-type:
    type: string
    description: "Document type label, for example Letter, Memo, Agenda."
  edition:
    type: string
    description: "Edition label, for example First Edition."
  review-date:
    type: string
    format: date
    description: "Next review date."
  supersedes:
    type: string
    description: "Reference of the document this one replaces."
  draft:
    type: boolean
    default: false
    description: "Renders a DRAFT watermark when true."
  watermark:
    type: string
    description: "Watermark text; overrides draft when set."
  toc:
    type: boolean
    default: true
    description: "Shows the table of contents."
  number-sections:
    type: boolean
    default: true
    description: "Numbers the section headings."
  verify:
    type: boolean
    default: false
    description: "Runs the soft local field verification (filters/verify.lua)."
  gscp:
    type: boolean
    default: false
    description: "Enables the GSCP classification mode."

  # ---- Letter ----
  letter:
    type: object
    description: "Structured letter fields."
    properties:
      address:
        type: array
        required: true
        minItems: 1
        description: "Recipient address lines (required)."
        items:
          type: string
      subject:
        type: string
        description: "Letter subject line."
      opening:
        type: string
        description: "Opening salutation, for example Dear Sir or Madam,"
      closing:
        type: string
        description: "Closing salutation, for example Yours faithfully,"
      cc:
        type: array
        description: "Carbon copy recipients."
        items:
          type: string
      encl:
        type: array
        description: "Enclosures."
        items:
          type: string
      ps:
        type: string
        description: "Postscript text."
      signature:
        type: string
        description: "Signature block under the closing, usually the author's name and title."

  # ---- Memo ----
  memo-style:
    type: string
    enum: [centred, flush-left, military]
    default: centred
    description: "Memo head layout. centred has a centred MEMORANDUM title, flush-left puts the title and date on one line, military uses the no-masthead Army memorandum form (MEMORANDUM FOR ... SUBJECT ...)."
  memo:
    type: object
    description: "Structured memo fields."
    properties:
      to:
        type: array
        required: true
        minItems: 1
        description: "Recipients (required)."
        items:
          type: string
      from:
        type: string
        required: true
        description: "Sender (required)."
      subject:
        type: string
        required: true
        description: "Memo subject (required)."
      cosig:
        type: string
        description: "Co-signature name."
      cosig-title:
        type: string
        description: "Co-signature title."

  # ---- Agenda ----
  agenda:
    type: object
    description: "Structured agenda fields."
    properties:
      meeting:
        type: string
        required: true
        description: "Meeting name (required)."
      date:
        type: string
        format: date
        required: true
        description: "Meeting date (required)."
      time:
        type: string
        required: true
        description: "Meeting time (required)."
      location:
        type: string
        required: true
        description: "Meeting location (required)."
      chair:
        type: string
        description: "Meeting chair."
      members:
        type: array
        description: "Attendees."
        items:
          type: string
      apologies:
        type: array
        description: "Those sending apologies."
        items:
          type: string
      guests:
        type: array
        description: "Guests."
        items:
          type: string

  # ---- Brief ----
  brief:
    type: object
    description: "Structured policy brief fields."
    properties:
      series:
        type: string
        description: "Brief series name."
      issue:
        type: string
        description: "Issue number within the series."
      key-findings:
        type: array
        description: "Key findings shown in the summary box."
        items:
          type: string
      cite-as:
        type: string
        description: "Suggested citation for the brief."
      contact:
        type: object
        description: "Contact for follow-up."
        properties:
          name:
            type: string
            description: "Contact name."
          email:
            type: string
            format: email
            description: "Contact email."
          phone:
            type: string
            description: "Contact phone."

  # ---- Decision record ----
  decision:
    type: object
    description: "Structured decision record fields (MADR conventions)."
    properties:
      status:
        type: string
        required: true
        enum: [Proposed, Accepted, Rejected, Superseded]
        description: "Decision status (required)."
      decision-makers:
        type: array
        description: "Those who made the decision."
        items:
          type: string
      consulted:
        type: array
        description: "Those consulted before the decision."
        items:
          type: string
      informed:
        type: array
        description: "Those informed of the decision."
        items:
          type: string

  # ---- Meeting minutes ----
  minutes:
    type: object
    description: "Structured meeting minutes fields."
    properties:
      committee:
        type: string
        required: true
        description: "Committee name (required)."
      date:
        type: string
        format: date
        required: true
        description: "Meeting date (required)."
      time:
        type: string
        description: "Meeting time."
      location:
        type: string
        description: "Meeting location."
      chair:
        type: string
        description: "Meeting chair."
      notetaker:
        type: string
        description: "Minutes notetaker."
      present:
        type: array
        description: "Members present."
        items:
          type: string
      absent:
        type: array
        description: "Members absent."
        items:
          type: string
      guests:
        type: array
        description: "Guests."
        items:
          type: string
      actions:
        type: array
        description: "Action items, sorted by due date at render."
        items:
          type: object
          description: "One action item."
          properties:
            owner:
              type: string
              description: "Owner of the action."
            due:
              type: string
              format: date
              description: "Due date."
            text:
              type: string
              description: "The action itself."

  # ---- Contract ----
  contract:
    type: object
    description: "Structured contract fields."
    properties:
      party-a:
        type: object
        description: "First party."
        properties:
          name:
            type: string
            required: true
            description: "Party name (required)."
          address:
            type: string
            description: "Party address."
      party-b:
        type: object
        description: "Second party."
        properties:
          name:
            type: string
            required: true
            description: "Party name (required)."
          address:
            type: string
            description: "Party address."
      term:
        type: string
        description: "Contract term."
      governing-law:
        type: string
        description: "Governing law."

  # ---- Press release ----
  press-release:
    type: object
    description: "Structured press release fields."
    properties:
      status:
        type: string
        description: "Release line, defaults to FOR IMMEDIATE RELEASE."
      subheadline:
        type: string
        description: "Subheadline under the title."
      dateline:
        type: string
        description: "Dateline, e.g. LONDON -- 16 August 2026."
      contacts:
        type: array
        description: "Media contacts."
        items:
          type: string

  # ---- Newsletter ----
  newsletter:
    type: object
    description: "Structured newsletter fields."
    properties:
      name:
        type: string
        required: true
        description: "Publication name (required)."
      issue:
        type: string
        required: true
        description: "Issue number (required)."
      date:
        type: string
        format: date
        description: "Publication date, defaults to the document date."

  # ---- Certificate ----
  certificate:
    type: object
    description: "Structured certificate fields."
    properties:
      type:
        type: string
        required: true
        description: "Certificate type, e.g. Certificate of Achievement (required)."
      recipient:
        type: string
        required: true
        description: "Recipient name (required)."
      date:
        type: string
        format: date
        description: "Award date, defaults to the document date."

  # ---- Reading list ----
  reading-list:
    type: object
    description: "Structured reading list fields."
    properties:
      scope:
        type: string
        description: "Scope of the list, e.g. MOD Defence Logistics Framework."

  # ---- SOP ----
  sop:
    type: object
    description: "Structured standard operating procedure fields."
    properties:
      number:
        type: string
        required: true
        description: "SOP number (required)."
      approved-by:
        type: string
        description: "Approving authority."
      revision-date:
        type: string
        format: date
        description: "Latest revision date."
      author:
        type: string
        description: "Document author."

  # ---- After-action report ----
  after-action:
    type: object
    description: "Structured after-action report fields."
    properties:
      facilitator:
        type: string
        description: "After-action review facilitator."
      scenario:
        type: string
        description: "Scenario or exercise name."

  # ---- Business case ----
  business-case:
    type: object
    description: "Structured business case fields (UK Green Book)."
    properties:
      status:
        type: string
        description: "Case status, e.g. Draft or Approved."
      version:
        type: string
        description: "Case version."
      sponsor:
        type: string
        description: "Senior responsible owner or sponsor."

  # ---- Project charter ----
  project-charter:
    type: object
    description: "Structured project charter fields."
    properties:
      sponsor:
        type: string
        description: "Project sponsor."
      team:
        type: string
        description: "Project team, one line."

  # ---- DPIA ----
  dpia:
    type: object
    description: "Structured data protection impact assessment fields (GDPR Article 35)."
    properties:
      activity:
        type: string
        description: "Processing activity being assessed."
      controller:
        type: string
        description: "Data controller."
      dpo:
        type: string
        description: "Data protection officer consulted."

  # ---- Audit report ----
  audit-report:
    type: object
    description: "Structured internal audit report fields."
    properties:
      number:
        type: string
        required: true
        description: "Audit number, e.g. IA-2026-014 (required)."
      status:
        type: string
        enum: [Draft, Final]
        description: "Report status."
      scope:
        type: string
        description: "Audit scope, one line."

  # ---- Incident report ----
  incident-report:
    type: object
    description: "Structured incident report fields (ITIL)."
    properties:
      severity:
        type: string
        description: "Severity, e.g. SEV1 to SEV4."
      duration:
        type: string
        description: "Incident duration."
      status:
        type: string
        description: "Incident status, e.g. Open, Resolved, Closed."

  # ---- Statement of work ----
  sow:
    type: object
    description: "Structured statement of work fields."
    properties:
      client:
        type: string
        description: "Client name."
      period:
        type: string
        description: "Delivery period."

  # ---- Fact sheet ----
  fact-sheet:
    type: object
    description: "Structured fact sheet fields."
    properties:
      last-updated:
        type: string
        format: date
        description: "Last updated date."
      developer:
        type: string
        description: "Developer or owner of the entity."
      launch-date:
        type: string
        format: date
        description: "Launch date."

  # ---- Requirements specification ----
  requirements-spec:
    type: object
    description: "Structured requirements specification fields (IEEE 830)."
    properties:
      version:
        type: string
        description: "Document version."
      status:
        type: string
        description: "Document status, e.g. Draft, Approved."
      approval:
        type: string
        description: "Approval authority and date."

  # ---- Technical design document ----
  technical-design:
    type: object
    description: "Structured technical design document fields (IEEE 1016)."
    properties:
      version:
        type: string
        description: "Document version."
      status:
        type: string
        description: "Document status, e.g. Draft, Approved."
      author:
        type: string
        description: "Design author."

  # ---- Reference letter ----
  reference-letter:
    type: object
    description: "Structured reference letter fields."
    properties:
      addressee:
        type: string
        description: "Recipient of the letter."
      candidate:
        type: string
        description: "Person the letter recommends."
      salutation:
        type: string
        description: "Opening line, e.g. To whom it may concern."

  # ---- Staff report ----
  staff-report:
    type: object
    description: "Structured staff report fields."
    properties:
      to:
        type: string
        required: true
        description: "Addressee (required)."
      from:
        type: string
        required: true
        description: "Sender (required)."

  # ---- Release notes ----
  release-notes:
    type: object
    description: "Structured release notes fields."
    properties:
      version:
        type: string
        required: true
        description: "Release version (required)."
      status:
        type: string
        description: "Release status, e.g. Stable, Beta."

  # ---- Test report ----
  test-report:
    type: object
    description: "Structured test report fields."
    properties:
      version:
        type: string
        description: "Version under test."
      tester:
        type: string
        description: "Person or team running the tests."

  # ---- Request for proposal ----
  rfp:
    type: object
    description: "Structured request for proposal fields."
    properties:
      issuer:
        type: string
        required: true
        description: "Issuing organisation (required)."
      deadline:
        type: string
        format: date
        description: "Submission deadline."

  # ---- Service level agreement ----
  sla:
    type: object
    description: "Structured service level agreement fields."
    properties:
      parties:
        type: string
        required: true
        description: "Contracting parties (required)."
      term:
        type: string
        description: "Agreement term."

  # ---- Invoice ----
  invoice:
    type: object
    description: "Structured invoice fields."
    properties:
      number:
        type: string
        required: true
        description: "Invoice number (required)."
      date:
        type: string
        format: date
        required: true
        description: "Invoice date (required)."
      supply-date:
        type: string
        format: date
        description: "Supply date. UK law separates this from the invoice date."
      due-date:
        type: string
        format: date
        description: "Payment due date."
      po-number:
        type: string
        description: "Purchase order number."
      sender:
        type: object
        description: "Business letterhead. Optional; the filter falls back to the document author."
        properties:
          name:
            type: string
            description: "Business name in the letterhead."
          address:
            type: array
            description: "Business address in the letterhead, one line per line break."
            items:
              type: string
          contact:
            type: string
            description: "Contact line in the letterhead, for example email and phone."
      subtotal:
        type: [number, string]
        minimum: 0
        description: "Optional stated subtotal, as a number or a money string; the filter recomputes it from the items."
      client:
        type: object
        required: true
        description: "Client block (required)."
        properties:
          name:
            type: string
            required: true
            description: "Client name (required)."
          address:
            type: array
            description: "Client address lines."
            items:
              type: string
      items:
        type: array
        required: true
        minItems: 1
        description: "Line items (required, at least one)."
        items:
          type: object
          properties:
            description:
              type: string
              required: true
              description: "Item description (required)."
            quantity:
              type: number
              minimum: 1
              description: "Item quantity, a positive number (the verifier rejects zero or negative)."
            unit-price:
              type: [number, string]
              minimum: 0
              description: "Unit price in GBP, as a number or a money string (for example \"300.00\" or \"£300.00\")."
      payment:
        type: object
        description: "Payment block."
        properties:
          provider:
            type: string
            enum:
              - stripe
              - paypal
              - generic
              - bank-transfer
              - none
            description: "Payment provider. stripe and paypal need a link."
          link:
            type: string
            format: uri
            description: "Payment link for stripe or paypal."
      vat-status:
        type: string
        description: "VAT statement, for example 'Not registered for VAT'."
      discount:
        type: [number, string]
        description: "Discount in GBP, as a number or a money string (for example \"25.00\")."
      tax:
        type: [number, string]
        description: "Tax amount in GBP, as a number or a money string (for example \"0.00\")."
