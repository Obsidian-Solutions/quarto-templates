title: Obsidian Solutions PDF
author: Obsidian Solutions
version: 3.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    pdf:
      pdf-engine: lualatex
      documentclass: article
      papersize: a4
      fontsize: 12pt
      linestretch: 1.15
      geometry:
        - top=2.6cm
        - bottom=2.6cm
        - left=2.4cm
        - right=2.4cm
      lang: en-GB
      toc: true
      toc-depth: 2
      toc-title: Contents
      # List of tables and figures in the roman-numbered front matter
      # (JSP 101 layout). Disable with `lof: false` / `lot: false`.
      lof: true
      lot: true
      number-sections: true
      # Citations: numbered references via a bundled CSL. Documents
      # supply a `bibliography:` path; in-text citations become
      # clickable links to the references list.
      citeproc: true
      link-citations: true
      csl: numeric.csl
      # Archival PDF/A-4f output. Requires LuaLaTeX and LaTeX 2023+,
      # which the template pins via pdf-engine and TeX Live 2026.
      # Validate with: quarto install verapdf
      pdf-standard: [a-4f]
      mainfont: "TeX Gyre Pagella"
      sansfont: "Montserrat"
      monofont: "Liberation Mono"
      format-resources:
        - assets/obsidian-logo.png
        - assets/obsidian-favicon.png
      include-in-header: include-in-header.tex
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
        - partials/hypersetup.latex
        - partials/document-metadata.latex
        - partials/toc.tex
      filters:
        - filters/appendix.lua
        - filters/embed.lua
        - filters/review-overdue.lua
      # Monochrome callouts: Quarto's default callout-warning draws an
      # amber triangle. Disable the icon and use a near-black border so
      # the palette stays clean.
      callout-appearance: simple
      callout-icon: false
      callout-color: '#121212'
    docx:
      # Client-editable output. The reference document carries the
      # house style: Palatino Linotype body, Montserrat headings,
      # near-black and grey palette, booktabs tables, branded header
      # and footer with page numbers. Palatino Linotype ships with
      # Windows and macOS Office, so client machines render it without
      # substitution.
      reference-doc: obsidian-reference.docx
      toc: true
      toc-depth: 2
      number-sections: true
      citeproc: true
      link-citations: true
      csl: numeric.csl
    html:
      # Accessible reading companion, per the HTML-first rule. The
      # theme carries the house palette, typography and focus states;
      # the classification filter adds the marking banner.
      theme: theme.scss
      toc: true
      toc-depth: 2
      number-sections: true
      citeproc: true
      link-citations: true
      csl: numeric.csl
      filters:
        - filters/classification.lua
        - filters/review-overdue.lua
