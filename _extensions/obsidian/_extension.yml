# SPDX-License-Identifier: MIT
title: Obsidian Solutions Templates
author: Obsidian Solutions
version: 3.5.0
description: >-
  Controlled business documents in the Obsidian Solutions brand: PDF/A-4f
  with provenance, accessible HTML, client-editable DOCX, revealjs decks,
  and dashboards, from one source file.
license: MIT
quarto-required: ">=1.9.0"
contributes:
  formats:
    pdf:
      pdf-engine: lualatex
      documentclass: article
      papersize: a4
      fontsize: 12pt
      linestretch: 1.15
      geometry:
        - top=2.6cm
        - bottom=2.6cm
        - left=2.4cm
        - right=2.4cm
      lang: en-GB
      toc: true
      toc-depth: 2
      toc-title: Contents
      # List of tables and figures in the roman-numbered front matter
      # (JSP 101 layout). Disable with `lof: false` / `lot: false`.
      lof: true
      lot: true
      number-sections: true
      # Citations: numbered references via a bundled CSL. Documents
      # supply a `bibliography:` path; in-text citations become
      # clickable links to the references list.
      citeproc: true
      link-citations: true
      csl: numeric.csl
      # PDF standard: the archival default is PDF/A-4f (ISO 19005-4,
      # current for new work; embeds the source and manifest for
      # self-contained provenance). This is a default, not a limit:
      # every document overrides it in its own front matter with
      # `format: obsidian-pdf: pdf-standard: <value>`. Quarto 1.10
      # supports the full matrix for LuaLaTeX: PDF versions 1.4-2.0,
      # PDF/A a-1b/a-2a/a-2b/a-2u/a-3a/a-3b/a-3u/a-4/a-4f, PDF/UA
      # ua-2, and PDF/X x-4/x-4p/x-5g/x-5n/x-5pg/x-6/x-6n/x-6p.
      # Quarto validates each render against the requested standard.
      # Known limits of specific standards: a-1b forbids embedded
      # files (drop `attach:`) and transparency (the brand logo PNG
      # carries alpha, so use a flattened asset); ua-2 has upstream
      # LaTeX tagging gaps (see accessibility-statement.md).
      # Validate with: quarto install verapdf
      pdf-standard: [a-4f]
      # Keep the LaTeX log so render.sh can check it for overfull
      # boxes (content overflowing the printable area). Quarto deletes
      # the log by default (latex-clean: true), hiding the signal.
      latex-clean: false
      mainfont: "TeX Gyre Pagella"
      sansfont: "Montserrat"
      monofont: "Liberation Mono"
      format-resources:
        - assets/obsidian-logo.png
        - assets/obsidian-favicon.png
        # Neutral corner motif for the bg-image titlepage theme; a
        # document can set titlepage-bg-image to any image instead.
        - assets/corner-bg.png
        # Generated from brand.yml by tools/tokens.py; the preamble
        # inputs it so the palette lives in one place.
        - tokens.tex
      include-in-header: include-in-header.tex
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
        - partials/hypersetup.latex
        - partials/document-metadata.latex
        - partials/toc.tex
        # Themed title page (opt-in via the `titlepage:` front-matter
        # key; see filters/titlepage.lua). When the key is absent the
        # standard cover in before-body.tex renders, so existing
        # documents are unaffected.
        - partials/titlepage.tex
        - partials/titlepage-title-themes.tex
        - partials/titlepage-author-affiliation.tex
        - partials/titlepage-header-footer-date.tex
      filters:
        - filters/titlepage.lua
        - filters/classification-gate.lua
        - filters/appendix.lua
        - filters/embed.lua
        - filters/review-overdue.lua
        - filters/has-floats.lua
      # Monochrome callouts: Quarto's default callout-warning draws an
      # amber triangle. Disable the icon and use a near-black border so
      # the palette stays clean.
      callout-appearance: simple
      callout-icon: false
      callout-color: '#121212'
    docx:
      # Client-editable output. The reference document carries the
      # house style: Palatino Linotype body, Montserrat headings,
      # near-black and grey palette, booktabs tables, branded header
      # and footer with page numbers. The header classification is a
      # Word DOCPROPERTY field fed from front-matter metadata, so
      # every copy carries the same marking as the PDF. Palatino
      # Linotype ships with Windows and macOS Office, so client
      # machines render it without substitution.
      reference-doc: obsidian-reference.docx
      toc: true
      toc-depth: 2
      number-sections: true
      citeproc: true
      link-citations: true
      csl: numeric.csl
      filters:
        - filters/classification-gate.lua
        - filters/classification.lua
        - filters/review-overdue.lua
    pptx:
      # Editable deck, the presentation parallel to DOCX. The
      # reference file carries the classification marking in the
      # footer placeholders, which pandoc copies to every slide
      # (the <p:hf> mechanism), so a deck never loses its marking.
      # Montserrat headings on the near-black/grey palette via the
      # theme fonts.
      reference-doc: obsidian-reference.pptx
      slide-level: 2
      incremental: false
      filters:
        - filters/classification-gate.lua
        - filters/classification.lua
    html:
      # Accessible reading companion, per the HTML-first rule. The
      # theme carries the house palette, typography and focus states;
      # the classification filter adds the marking banner. The dark
      # variant (theme-dark.scss) follows the reader's system
      # preference. The title-block banner gives the document a
      # branded band; the brand mark renders at its left via the
      # theme (theme.scss styles .quarto-title-banner::before with
      # the logo).
      theme:
        light: theme.scss
        dark: theme-dark.scss
      title-block-banner: true
      toc: true
      toc-depth: 2
      number-sections: true
      citeproc: true
      link-citations: true
      csl: numeric.csl
      filters:
        - filters/classification-gate.lua
        - filters/classification.lua
        - filters/review-overdue.lua
        # Maps definition lists to the summary-list component (an
        # opt-in key/value table for the HTML companion).
        - filters/summary-list.lua
    revealjs:
      # Client presentations. The revealjs theme carries the house
      # palette and typography; the classification filter marks each
      # slide deck. The brand mark sits bottom-right on every slide.
      theme: theme-reveal.scss
      logo: assets/obsidian-logo.png
      toc: true
      toc-depth: 2
      citeproc: true
      link-citations: true
      csl: numeric.csl
      filters:
        - filters/classification-gate.lua
        - filters/classification.lua
        - filters/review-overdue.lua
    beamer:
      # PDF presentations via LaTeX beamer. The article-style partials
      # (cover, fancyhdr) do not apply; a beamer-specific header carries
      # the monochrome palette, the classification footline, and the
      # near-black rule. The title partial defines the classification
      # command in the preamble, before the document starts. `##`
      # headings become slides, matching the revealjs examples. The
      # font pairing matches the article formats: Palatino body,
      # Montserrat headings. The brand mark sits top-right on the
      # title slide (beamer's native logo placement).
      mainfont: "TeX Gyre Pagella"
      sansfont: "Montserrat"
      monofont: "Liberation Mono"
      logo: assets/obsidian-logo.png
      include-in-header: include-in-header-beamer.tex
      template-partials:
        - partials/beamer/title.tex
        - partials/beamer/before-body.tex
      filters:
        - filters/classification-gate.lua
      aspectratio: 169
      slide-level: 2
    dashboard:
      # Client-facing dashboards. The html theme carries the house
      # palette and typography; dashboards are live-data products,
      # so only the classification filter applies (review warnings
      # are for documents). The brand mark sits left in the
      # navigation bar.
      theme: theme.scss
      logo: assets/obsidian-logo.png
      toc: true
      filters:
        - filters/classification-gate.lua
        - filters/classification.lua
    epub:
      # E-reader distribution. The classification banner and the
      # controlled-language gate apply; the palette comes from
      # epub.css, and the brand mark becomes the cover image.
      css: epub.css
      cover-image: assets/obsidian-logo.png
      filters:
        - filters/classification-gate.lua
        - filters/classification.lua
    typst:
      # Fast-render Typst companion to the archival PDF. Carries the
      # same identity (classification, cover, house fonts and
      # palette); render.sh attaches the PDF/A-4f provenance after
      # the render (attach-provenance.py), so the Typst archive is
      # as self-contained as the LaTeX one. The LaTeX log gates do
      # not apply; the STE, font and PDF/UA gates do.
      # The bundled obsidian-doc package lives under
      # typst/packages/preview/ and is imported by typst-template.typ.
      # The house body font (TeX Gyre Pagella) ships under
      # typst/fonts/ with its GUST licence: fontdb does not scan the
      # TeX Live font directory, so the font is bundled and the path
      # declared here. Montserrat and Liberation Mono come from the
      # system font dirs, which fontdb does scan.
      font-paths:
        - typst/fonts
      # typst-meta.lua forwards number-sections into pandoc metadata:
      # pandoc's typst writer never sets the numbersections template
      # variable (unlike its LaTeX writer), so the show file needs
      # the filter to see the document's flag.
      filters:
        - filters/typst-meta.lua
      template-partials:
        - typst-template.typ
        - typst-show.typ
