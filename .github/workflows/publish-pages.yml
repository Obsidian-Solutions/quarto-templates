name: publish-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render the example site
        run: |
          # The example renders to HTML with the brand theme and the
          # classification banner. The full PDF pipeline is covered by
          # render-and-validate.yml; the site only needs the HTML.
          quarto render example.qmd --to obsidian-html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: example.html

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
