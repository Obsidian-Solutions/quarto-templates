name: Feature request
description: Propose a new capability for the templates or tools
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. State the problem first,
        then the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot you do today? Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you want. Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds exist today? Why are they not enough?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - PDF format
        - Typst format
        - HTML components
        - Design tokens
        - Verification gates
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the documentation and existing issues first
          required: true
