# SPDX-License-Identifier: MIT
name: render-and-validate
# Renders the example document in all three formats and gates on the
# validation the template guarantees. Applies the "verify every
# change" rule to the template itself: a document that renders here
# is the "properly ready" state for the public flip.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Token drift check
        run: |
          # The design tokens must stay in step: brand.yml is the
          # single source, the generated tokens.tex/tokens.scss must
          # match it, and the HTML light theme's literal values must
          # agree with the semantic roles. A drift fails the check so
          # a rebrand never half-applies.
          python3 tools/tokens.py --check
          git diff --exit-code _extensions/obsidian/tokens.tex _extensions/obsidian/tokens.scss || {
            echo "tokens.tex or tokens.scss is stale - run tools/tokens.py and commit the result"
            exit 1
          }

      - name: Unit tests, docs check, and format smoke
        run: |
          # Unit tests for the tools and Lua filters (tokens drift,
          # provenance/pptx attachment fixtures, filter behaviour),
          # the docs-consistency check (formats, gates, examples all
          # agree), and a full smoke render of one document through
          # every format. A failure here means a tool or the docs
          # catalogue regressed.
          python3 -m unittest tools.test_tools tools.test_lua_filters -v
          python3 tools/check-docs.py
          ./tools/smoke.sh examples/template.qmd

      - name: SBOM freshness check
        run: |
          # The committed SBOM must match what the generator produces
          # from this tree, or the supply-chain record is stale. The
          # document namespace and created timestamp are commit-derived
          # by design (they identify the exact baseline), so the
          # comparison ignores them and checks the package content.
          python3 tools/make-sbom.py /tmp/sbom-check.json
          python3 - <<'EOF'
          import json
          a = json.load(open('sbom.spdx.json'))
          b = json.load(open('/tmp/sbom-check.json'))
          for doc in (a, b):
              doc.pop('documentNamespace', None)
              doc['creationInfo'].pop('created', None)
          assert a == b, 'sbom.spdx.json is stale - run tools/make-sbom.py and commit the result'
          print('SBOM fresh')
          EOF

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.10.18

      - name: Install TeX Live (TinyTeX, matches the 2026 dev toolchain)
        run: |
          # Ubuntu's apt TeX Live 2023 cannot run \DocumentMetadata with
          # pdf-standard (missing the 2025+ pdfmanagement rename). TinyTeX
          # is a rolling distribution that matches the Arch TeX Live 2026
          # the template is developed against. --update-path puts tlmgr
          # and lualatex on PATH (the flag the Quarto docs name).
          # Accepted supply-chain risk: TinyTeX and its packages are
          # unpinned (rolling by design). The GitHub Actions and the
          # Montserrat fonts ARE pinned and checksum-verified; revisit
          # TinyTeX pinning if this CI must meet a stricter baseline.
          quarto install tinytex --update-path
          # TinyTeX base already carries Latin Modern, fontspec and the
          # kernel. Install the document-class packages the template
          # preamble uses, plus TeX Gyre Pagella (the main font).
          tlmgr install \
            titlesec fancyhdr zref draftwatermark tocloft embedfile \
            tcolorbox needspace caption microtype booktabs etoolbox float \
            fontspec tex-gyre
          which tlmgr lualatex && lualatex --version | head -1

      - name: Install Montserrat (pinned upstream commit, SHA-256 verified)
        run: bash tools/install-fonts.sh

      - name: Install verapdf, qpdf, and pikepdf
        run: |
          quarto install verapdf
          sudo apt-get update && sudo apt-get install -y qpdf fonts-liberation poppler-utils
          # pikepdf backs the Typst provenance gate (tools/attach-provenance.py).
          pip install --quiet pikepdf

      - name: Render default document (PDF/A-4f)
        run: ./render.sh examples/template.qmd

      - name: Render the thin document templates
        run: |
          # The letter, memo, agenda and brief are thin documents on
          # the house identity; each must render through the gates.
          for t in letter memo agenda brief; do
            ./render.sh examples/template-$t.qmd
          done

      - name: Assert PDF/A-4f validation passed
        run: |
          # render.sh already ran verapdf and failed on violation.
          # Re-validate explicitly so the CI log shows the result.
          VERAPDF="$HOME/.local/share/quarto/verapdf/verapdf"
          "$VERAPDF" --format text _output/examples/template.pdf | grep -q "PASS.*4f"

      - name: Assert self-contained provenance
        run: |
          qpdf --qdf --object-streams=disable _output/examples/template.pdf /tmp/tree.pdf
          grep -q "AFRelationship" /tmp/tree.pdf
          grep -q "EmbeddedFiles" /tmp/tree.pdf
          grep -q "OS-DOC-001" _output/examples/template.pdf

      - name: Render Typst fast-draft (PDF/A-4f)
        run: |
          # The Typst engine produces the same provenance model as the
          # LaTeX PDF: render.sh attaches the source and manifest with
          # the AFRelationship + MIME keys PDF/A-4f requires, and
          # veraPDF validates the result. Run it through the full
          # pipeline so the provenance gate fires.
          ./render.sh examples/template-typst.qmd

      - name: Assert Typst PDF/A-4f with provenance
        run: |
          VERAPDF="$HOME/.local/share/quarto/verapdf/verapdf"
          "$VERAPDF" --format text _output/examples/template-typst.pdf | grep -q "PASS.*4f"
          qpdf --list-attachments _output/examples/template-typst.pdf | grep -q "template-typst.qmd"
          qpdf --list-attachments _output/examples/template-typst.pdf | grep -q "manifest.json"

      - name: Render Typst accessible path (PDF/A-2b + PDF/UA-1)
        run: |
          # The Typst engine tags headings with real roles (H1, H2),
          # which the LaTeX path cannot do. ua-1 is a PDF 1.7
          # standard and cannot combine with a-4f (PDF 2.0), so the
          # accessible path is a-2b + ua-1. Copy the example with the
          # standard overridden and run the structure gate: it must
          # PASS, proving the accessible claim stays true. The copy
          # stays inside the repo so Quarto resolves the extension.
          cp examples/template-typst.qmd examples/typst-ua.qmd
          python3 - <<'PYEOF'
          import re
          p = 'examples/typst-ua.qmd'
          s = open(p).read()
          s = re.sub(r'pdf-standard: a-4f', 'pdf-standard: [a-2b, ua-1]', s, count=1)
          open(p, 'w').write(s)
          PYEOF
          quarto render examples/typst-ua.qmd --to obsidian-typst
          python3 tools/check-pdfua.py _output/examples/typst-ua.pdf
          rm -f examples/typst-ua.qmd _output/examples/typst-ua.pdf

      - name: Render HTML companion
        run: quarto render examples/template.qmd --to obsidian-html

      - name: Assert HTML classification banner
        run: |
          grep -q "obsidian-classification" _output/examples/template.html
          grep -q "Commercial in Confidence" _output/examples/template.html

      - name: Render DOCX companion
        run: quarto render examples/template.qmd --to obsidian-docx

      - name: Assert DOCX is a valid archive
        run: |
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('_output/examples/template.docx')
          assert z.testzip() is None
          assert 'word/document.xml' in z.namelist()
          EOF

      - name: Render the deck formats
        run: |
          # One command renders the deck's declared formats: revealjs
          # html, beamer PDF, and pptx. The presentation formats need
          # no TeX engine for the html, but the beamer PDF does; this
          # job already carries the TeX toolchain.
          quarto render examples/template-slides.qmd

      - name: Assert beamer deck (PDF slides)
        run: |
          # render.sh rendered template-slides.qmd with its declared
          # formats, which include the beamer PDF. The classification
          # marking and the frame number must sit on every slide,
          # including the title slide.
          pages=$(pdfinfo _output/examples/template-slides.pdf | awk '/^Pages/{print $2}')
          [ "$pages" -eq 6 ] || { echo "expected 6 slides, got $pages"; exit 1; }
          for p in $(seq 1 "$pages"); do
            pdftotext -f "$p" -l "$p" _output/examples/template-slides.pdf - | \
              grep -q "Commercial in Confidence" || { echo "marking missing on slide $p"; exit 1; }
          done

      - name: Assert epub carries banner and cover
        run: |
          # render.sh produced the epub from the declared formats. The
          # classification banner must be in the book, and the brand
          # mark must be the cover image.
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('_output/examples/template.epub')
          names = z.namelist()
          assert z.testzip() is None
          content = [z.read(n).decode() for n in names if n.endswith(('.xhtml', '.html'))]
          assert any('obsidian-classification' in c and 'Commercial in Confidence' in c for c in content), \
              'classification banner missing from epub content'
          assert any('cover' in n.lower() for n in names), 'no cover image in epub'
          EOF

      - name: Assert revealjs deck is marked
        run: |
          grep -q "obsidian-classification" _output/examples/template-slides.html
          grep -q "Commercial in Confidence" _output/examples/template-slides.html

      - name: Assert pptx marking on every slide
        run: |
          # The classification marking must be on every slide, via
          # the reference-file footer mechanism.
          python3 -c "
          import zipfile
          z = zipfile.ZipFile('_output/examples/template-slides.pptx')
          slides = [n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
          assert len(slides) >= 2, 'deck has no slides'
          for n in slides:
              assert 'Commercial in Confidence' in z.read(n).decode(), f'marking missing in {n}'
          print('classification on every slide: OK')"

      - name: Assert dashboard is marked
        run: |
          quarto render examples/template-dashboard.qmd
          grep -q "obsidian-classification" _output/examples/template-dashboard.html

  # The UA-2 path is informational: the structure gate fails on the
  # documented upstream gap (Quarto/KOMA emit a flat tag tree with no
  # heading roles; veraPDF passes by design). continue-on-error keeps
  # the finding visible in CI without blocking the default pipeline.
  ua2:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.10.18

      - name: Install TeX Live (TinyTeX, matches the 2026 dev toolchain)
        run: |
          # Ubuntu's apt TeX Live 2023 cannot run \DocumentMetadata with
          # pdf-standard (missing the 2025+ pdfmanagement rename). TinyTeX
          # is a rolling distribution that matches the Arch TeX Live 2026
          # the template is developed against. --update-path puts tlmgr
          # and lualatex on PATH (the flag the Quarto docs name).
          # Accepted supply-chain risk: TinyTeX and its packages are
          # unpinned (rolling by design). The GitHub Actions and the
          # Montserrat fonts ARE pinned and checksum-verified; revisit
          # TinyTeX pinning if this CI must meet a stricter baseline.
          quarto install tinytex --update-path
          # TinyTeX base already carries Latin Modern, fontspec and the
          # kernel. Install the document-class packages the template
          # preamble uses, plus TeX Gyre Pagella (the main font).
          tlmgr install \
            titlesec fancyhdr zref draftwatermark tocloft embedfile \
            tcolorbox needspace caption microtype booktabs etoolbox float \
            fontspec tex-gyre
          which tlmgr lualatex && lualatex --version | head -1

      - name: Install Montserrat
        run: |
          mkdir -p ~/.fonts
          curl -sL "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Regular.ttf" -o ~/.fonts/Montserrat-Regular.ttf
          curl -sL "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf" -o ~/.fonts/Montserrat-Bold.ttf
          fc-cache -f ~/.fonts

      - name: Install verapdf
        run: quarto install verapdf

      - name: Render with PDF/UA-2
        run: |
          sed -i 's/pdf-standard: \[a-4f\]/pdf-standard: [a-4f, ua-2]/' _extensions/obsidian/_extension.yml
          sed -i '\|partials/document-metadata.latex|d' _extensions/obsidian/_extension.yml
          ./render.sh examples/template.qmd || true

      - name: Show the structure-gate finding
        run: |
          python3 tools/check-pdfua.py _output/examples/template.pdf || \
            echo "EXPECTED: heading-role gap documented in README (upstream KOMA/tagging limitation)"
          VERAPDF="$HOME/.local/share/quarto/verapdf/verapdf"
          "$VERAPDF" --format text _output/examples/template.pdf | tail -3
