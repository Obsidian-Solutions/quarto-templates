# Attest release assets
# Calls the org reusable signer when a release is published.
# workflow_dispatch backfills a release created before the workflow
# existed.
name: Attest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest, for example v1.2.3"
        required: true

permissions:
  id-token: write
  contents: read
  # attest-build-provenance persists the attestation to the
  # repository's attestation API; that requires this permission
  # (the caller's permissions are the ceiling for the reusable gate).
  attestations: write

jobs:
  attest:
    uses: Obsidian-Solutions/.github/.github/workflows/attest.yml@58e7b55b05eb406c880fc4b272cd9b8b36b0d459
