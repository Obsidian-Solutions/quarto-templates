name: release

# Creates a signed release baseline on main (JSP 945). A human
# chooses the version, because semantic versioning is a judgement
# call. The workflow does the rest: it regenerates the changelog from
# the commit history, keeps the version homes in step, regenerates
# the SBOM, and creates the signed release commit and tag.
#
# Setup before the first run, in the repository settings under
# Secrets and variables > Actions:
#   GPG_PRIVATE_KEY  the ASCII-armoured private key, base64-encoded
#   GPG_PASSPHRASE   the key passphrase
# The key is the sole trader's signing key
# (B01C553A35C91D92074C43EFC88147E3824D9DCF).
#
# The changelog generator, scripts/make-changelog.py, is stdlib and
# deterministic: the same history always produces the same file.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 3.4.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the changelog reads the tags and the
          # commits between them.
          fetch-depth: 0

      - name: Guard the signing key
        env:
          HAS_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "false" ]; then
            echo "Set the GPG_PRIVATE_KEY and GPG_PASSPHRASE secrets first." >&2
            exit 1
          fi

      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Generate the changelog and keep the version homes in step
        run: |
          python3 scripts/make-changelog.py --version ${{ inputs.version }}
          git add CHANGELOG.md sbom.spdx.json \
            _extensions/obsidian/_extension.yml scripts/make-sbom.py
          git commit -S -m "chore: prepare release v${{ inputs.version }}"
          git tag -s "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"

      - name: Push the release baseline
        run: |
          git push origin main
          git push origin "v${{ inputs.version }}"
