name: attest

# Signs the release assets with the workflow's OIDC identity, so a
# downloader can verify an artifact came from this repository (JSP
# 945 release process: artifact attestations for each release
# artifact). Runs when a release is published. workflow_dispatch
# backfills a release created before this workflow existed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest, for example v3.3.0"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG"
          ls -1

      - name: Attest the release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: assets/*
