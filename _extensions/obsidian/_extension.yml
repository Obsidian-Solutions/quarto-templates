title: Obsidian Solutions PDF
author: Obsidian Solutions
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    pdf:
      pdf-engine: lualatex
      documentclass: article
      papersize: a4
      fontsize: 11pt
      geometry:
        - top=25mm
        - bottom=25mm
        - left=28mm
        - right=28mm
      lang: en-GB
      toc: true
      toc-title: Contents
      number-sections: true
      mainfont: "Liberation Serif"
      sansfont: "Liberation Sans"
      monofont: "Liberation Mono"
      colorlinks: true
      linkcolor: obsidian-accent
      urlcolor: obsidian-accent
      include-in-header: include-in-header.tex
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
