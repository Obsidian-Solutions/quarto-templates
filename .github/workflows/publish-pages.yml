# SPDX-License-Identifier: MIT
name: publish-pages
# Builds the template showcase and deploys it to GitHub Pages.
# The site ships every format the template produces (PDF, HTML, DOCX,
# EPUB, slides, PPTX, dashboard, Typst) and every document type the
# examples demonstrate (letter, memo, agenda, brief, invoice, component
# showcase), plus the cover-theme family.
#
# The job runs in the same pinned container image as render-and-validate
# (see .github/Containerfile), so the site is built from the identical
# configuration baseline that gates the renders: Quarto 1.10.18, TinyTeX
# with the document-class packages, Montserrat, veraPDF, qpdf, pikepdf.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: ghcr.io/obsidian-solutions/quarto-templates-ci:1.10.18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the example (HTML, PDF, DOCX)
        run: |
          # render.sh stamps the baseline and generates manifest.json
          # (the embed filter attaches it to the PDF/A archive), then
          # validates with verapdf. It renders the formats declared in
          # the front matter: PDF, HTML, DOCX and EPUB.
          ./render.sh examples/template.qmd
          cp _extensions/obsidian/assets/obsidian-logo.png obsidian-logo.png

      - name: Render the document-type templates
        run: |
          # Each document type is its own example. The letter, memo,
          # agenda and brief are thin documents on the house identity,
          # rendered through the same gates as the main example. The
          # invoice is a single-format document (PDF); the component
          # showcase is the HTML document furniture. The invoice's
          # lot: false default renders here; the lot: true list-of-
          # tables path is exercised by the render-and-validate gate.
          for t in letter memo agenda brief; do
            ./render.sh examples/template-$t.qmd
          done
          ./render.sh examples/template-invoice.qmd
          quarto render examples/template-components.qmd --to obsidian-html

      - name: Render the remaining formats (deck, dashboard, typst)
        run: |
          # The example site ships every format the template produces.
          # Each example declares its full format family, so one
          # command per file renders them all: the deck yields the
          # revealjs html, its beamer PDF, and its editable PPTX; the
          # dashboard yields its html. render.sh already produced the
          # document's four formats (PDF, HTML, DOCX, EPUB) above.
          quarto render examples/template-slides.qmd
          quarto render examples/template-dashboard.qmd
          # The Typst fast-draft renders from its own example source
          # with PDF/A-4f provenance attached by render.sh.
          ./render.sh examples/template-typst.qmd

      - name: Assemble the site
        run: |
          mkdir -p site
          cp _output/examples/template.html site/index.html
          cp _output/examples/template.pdf site/template.pdf
          cp _output/examples/template.docx site/template.docx
          cp _output/examples/template.epub site/template.epub
          cp _output/examples/template-slides.html site/template-slides.html
          cp _output/examples/template-slides.pdf site/template-slides.pdf
          cp _output/examples/template-slides.pptx site/template-slides.pptx
          cp _output/examples/template-dashboard.html site/template-dashboard.html
          cp _output/examples/template-typst.pdf site/template-typst.pdf
          # Document-type showcase: the thin documents as PDFs and the
          # component showcase as HTML.
          for t in letter memo agenda brief invoice; do
            cp _output/examples/template-$t.pdf site/template-$t.pdf
          done
          cp _output/examples/template-components.html site/template-components.html
          cp obsidian-logo.png site/obsidian-logo.png
          # The accessibility statement ships as a rendered HTML page,
          # not a raw markdown file (a bare .md would serve as text).
          quarto render accessibility-statement.md --to html --output-dir site
          rm -f site/accessibility-statement.md
          cp -r _output/examples/template_files site/template_files
          cp -r _output/examples/template-slides_files site/template-slides_files
          cp -r _output/examples/template-dashboard_files site/template-dashboard_files
          # The cover-themes showcase: render the covers document once
          # per titlepage theme and ship the family so visitors can
          # browse every cover from the site.
          ./tools/render-covers.sh examples/template-covers.qmd
          mkdir -p site/covers
          cp examples/covers/covers-*.pdf site/covers/

      - name: Add format download links to the page
        run: |
          python3 - <<'PYEOF'
          # Insert a small download bar, the document-type row and the
          # cover-themes row inside the constrained content column
          # (main.content), so they match the body width instead of
          # spanning the viewport.
          html = open('site/index.html').read()
          bar = (
            '<div style="font-family: Montserrat, sans-serif; font-size: 0.85rem; '
            'border: 1px solid #cecece; border-left: 3px solid #121212; '
            'padding: 0.6rem 1rem; margin: 1rem 0; color: #484949;">'
            'Download: '
            '<a href="template.pdf">PDF</a> &nbsp;|&nbsp; '
            '<a href="template.docx">DOCX</a> &nbsp;|&nbsp; '
            '<a href="template.epub">EPUB</a> &nbsp;|&nbsp; '
            '<a href="index.html">HTML</a> &nbsp;|&nbsp; '
            '<a href="template-slides.html">Slides</a> &nbsp;|&nbsp; '
            '<a href="template-slides.pdf">Slides PDF</a> &nbsp;|&nbsp; '
            '<a href="template-slides.pptx">PPTX</a> &nbsp;|&nbsp; '
            '<a href="template-dashboard.html">Dashboard</a> &nbsp;|&nbsp; '
            '<a href="template-typst.pdf">Typst PDF</a> &nbsp;|&nbsp; '
            '<a href="accessibility-statement.html">Accessibility statement</a>'
            '</div>'
            '<div style="font-family: Montserrat, sans-serif; font-size: 0.8rem; '
            'color: #484949; margin: 0.4rem 0 1.5rem 0;">'
            'Document types: '
            '<a href="template-letter.pdf">letter</a> &nbsp;|&nbsp; '
            '<a href="template-memo.pdf">memo</a> &nbsp;|&nbsp; '
            '<a href="template-agenda.pdf">agenda</a> &nbsp;|&nbsp; '
            '<a href="template-brief.pdf">brief</a> &nbsp;|&nbsp; '
            '<a href="template-invoice.pdf">invoice</a> &nbsp;|&nbsp; '
            '<a href="template-components.html">components</a>'
            '</div>'
            '<div style="font-family: Montserrat, sans-serif; font-size: 0.8rem; '
            'color: #484949; margin: 0.4rem 0 1.5rem 0;">'
            'Cover themes: '
            '<a href="covers/covers-plain.pdf">plain</a> &nbsp;|&nbsp; '
            '<a href="covers/covers-formal.pdf">formal</a> &nbsp;|&nbsp; '
            '<a href="covers/covers-classic-lined.pdf">classic-lined</a> &nbsp;|&nbsp; '
            '<a href="covers/covers-colorbox.pdf">colorbox</a> &nbsp;|&nbsp; '
            '<a href="covers/covers-academic.pdf">academic</a> &nbsp;|&nbsp; '
            '<a href="covers/covers-bg-image.pdf">bg-image</a> &nbsp;|&nbsp; '
            '<a href="covers/covers-banded.pdf">banded</a> &nbsp;|&nbsp; '
            '<a href="covers/covers-banded-slate.pdf">banded-slate</a>'
            '</div>'
          )
          # Insert inside the content column: right after the <main>
          # opening tag (main.content is the constrained body column;
          # before it sits the full-width grid), so the bars match the
          # body width instead of spanning the viewport.
          anchor = '<main class="content'
          if anchor in html:
            i = html.index(anchor)
            j = html.index('>', i) + 1
            html = html[:j] + '\n' + bar + '\n' + html[j:]
          else:
            html = html.replace('</body>', bar + '</body>', 1)
          open('site/index.html', 'w').write(html)
          PYEOF

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
