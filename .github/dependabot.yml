# Dependabot version updates
# This repository's dependencies: the GitHub Actions used by the CI
# workflows. The validation script (check-ua.py) uses only the
# Python standard library, so there are no Python dependencies to
# track.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns: ["*"]
