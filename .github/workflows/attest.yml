# Attest release assets
# Calls the org reusable signer when a release is published.
# workflow_dispatch backfills a release created before the workflow
# existed.
name: Attest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest, for example v1.2.3"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  attest:
    uses: Obsidian-Solutions/.github/.github/workflows/attest.yml@9d338ad3b4c9c29b6de12ef5da78f7337b12c501
