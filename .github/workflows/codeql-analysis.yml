name: codeql

# Static analysis (SAST) per the UK Software Security Code of
# Practice 1.3 (security testing before distribution) and the D2S
# DevSecOps gate list (SAST: CodeQL, Semgrep or equivalent). The
# analysable surface is the Python build tooling in scripts/. The Lua
# filters have no CodeQL query pack, so they stay covered by the
# render-time validation gates in render-and-validate.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: python

      - name: Analyse
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
